<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F-15 Flight Sim</title>
<style>
:root{--bg:#bcd4ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1220}}
:root[data-theme="dark"]{--bg:#0a1220}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg)}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#hud{pointer-events:none}
:root{--glass:rgba(10,18,32,.88);--edge:rgba(255,255,255,.14);--ink:#eef3fa;--dim:#9db0c7;--acc:#ffb020;--grn:#4ad6a5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(6,12,24,.9)}}
:root[data-theme="dark"]{--glass:rgba(6,12,24,.9)}
#ui{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;font-family:"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:16px;box-shadow:0 10px 34px rgba(0,0,0,.4)}
kbd{display:inline-block;min-width:1.3em;padding:1px 6px;margin:0 1px;border:1px solid rgba(255,255,255,.35);border-bottom-width:3px;border-radius:5px;background:rgba(255,255,255,.1);font:700 .85em "Courier New",monospace;text-align:center;color:#fff}
#sb{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));width:216px;padding:12px 15px 13px;display:none;border-top:3px solid var(--acc)}
.hd{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.2em;color:var(--dim)}.hd b{color:var(--acc)}
.big{font-size:38px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.cap{font-size:10px;letter-spacing:.3em;color:var(--dim);margin-bottom:8px}
.rows div{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-top:1px solid rgba(255,255,255,.08)}.rows span{color:var(--dim)}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin:9px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--grn),var(--acc))}
.best{font-size:10px;letter-spacing:.25em;color:var(--dim);text-align:right}
#tut{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));width:min(370px,calc(100vw - 28px));padding:14px 16px;display:none;border-left:3px solid var(--grn)}
.th{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.25em;color:var(--grn)}.th b{color:var(--dim)}
.pb{height:4px;border-radius:2px;background:rgba(255,255,255,.12);margin:8px 0 10px;overflow:hidden}.pb i{display:block;height:100%;background:var(--grn);transition:width .4s}
.tt{font-size:19px;font-weight:800;margin-bottom:5px}.tx{font-size:14px;line-height:1.5;color:#dbe5f2}.tf{margin-top:10px;font-size:11px;color:var(--dim)}
#tut.flash{animation:fl .6s}@keyframes fl{0%{box-shadow:0 0 0 0 rgba(74,214,165,.8)}100%{box-shadow:0 0 0 22px rgba(74,214,165,0)}}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}
.btn{cursor:pointer;border:1px solid var(--edge);border-radius:12px;padding:14px 26px;font:800 16px "Trebuchet MS","Segoe UI",Arial,sans-serif;color:#10151e;background:linear-gradient(180deg,#ffd166,#ffb020);box-shadow:0 6px 20px rgba(0,0,0,.35)}
.btn kbd{color:#10151e;border-color:rgba(0,0,0,.4);background:rgba(255,255,255,.4)}
.btn.alt{background:var(--glass);color:var(--ink)}.btn.alt kbd{color:#fff;border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.1)}
.btn:hover{filter:brightness(1.1)}
.hsC{width:min(340px,100%);padding:12px 14px;text-align:left}
.hh{font-size:10px;letter-spacing:.3em;color:var(--dim);margin:2px 0 6px}
.hr{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:5px 8px;border-radius:8px}
.hr i{font-style:normal;color:var(--acc);font-weight:800}.hr span{font-weight:800;font-variant-numeric:tabular-nums}.hr em{font-style:normal;color:var(--dim);font-size:11px}.hr.me{background:rgba(255,176,32,.18)}.hr.dim{color:var(--dim)}
.fine{margin-top:18px;font-size:12px;letter-spacing:.12em;color:var(--dim)}
#end{position:absolute;left:0;top:0;width:100%;height:100%;display:none;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.endc{width:min(420px,100%);padding:20px 22px;text-align:center;border-top:3px solid #ff6a50}
.eh{font-size:12px;letter-spacing:.35em;color:var(--dim)}.er{font-size:17px;font-weight:800;color:#ff8a6a;margin:6px 0 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 14px}.grid div{background:rgba(255,255,255,.07);border-radius:10px;padding:8px 4px;font-size:11px;color:var(--dim)}.grid b{display:block;font-size:18px;color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:-8px 0 14px}
.chip{pointer-events:auto;cursor:pointer;border:1px solid var(--edge);background:var(--glass);color:var(--dim);border-radius:999px;padding:7px 14px;font:700 12px "Trebuchet MS","Segoe UI",Arial,sans-serif;letter-spacing:.12em}
.chip.on{color:#10151e;background:var(--acc);border-color:var(--acc)}
#mis{position:absolute;top:calc(62px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:none;padding:9px 16px 8px;min-width:250px;border-bottom:3px solid var(--grn)}
.go{margin-top:14px;font-size:12px;color:var(--dim)}

#title{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none;--bh:188px;--cy:#31d7ff;--cyd:#7fb9d4;--yl:#ffc933;font-family:"Eurostile","Bank Gothic","Orbitron","Segoe UI","Trebuchet MS",Roboto,Arial,sans-serif;color:var(--cy);text-transform:uppercase;background:linear-gradient(180deg,rgba(0,6,14,.62) 0,rgba(0,0,0,0) 20%,rgba(0,0,0,0) 64%,rgba(0,5,10,.55) 100%)}

#tHead{position:absolute;left:0;right:0;top:calc(14px + env(safe-area-inset-top,0px));text-align:center}
#tHead h1{margin:0;font-size:clamp(24px,3.6vw,44px);letter-spacing:.38em;font-weight:900;color:var(--cy);text-shadow:0 0 12px rgba(49,215,255,.85),0 0 34px rgba(49,215,255,.45);padding-left:.38em}

.holo::before{content:"";position:absolute;left:-1px;top:-1px;width:16px;height:16px;border-left:3px solid var(--yl);border-top:3px solid var(--yl);pointer-events:none}
.holo::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(49,215,255,.05) 0 1px,transparent 1px 3px)}
.ph{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:11px;letter-spacing:.38em;color:var(--yl);font-weight:800}
.ph::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,201,51,.7),rgba(255,201,51,0))}
.opt{position:relative;display:block;width:100%;text-align:left;cursor:pointer;background:rgba(0,34,62,.6);border:1px solid rgba(49,215,255,.38);color:var(--cy);padding:10px 12px 10px 16px;font:inherit;text-transform:none;transition:background .15s,border-color .15s,box-shadow .15s}
.opt b{display:block;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#7fe9ff;font-weight:800}
.opt span{display:block;margin-top:4px;font-size:12px;line-height:1.35;color:var(--cyd);letter-spacing:.02em}
.opt:hover{border-color:#8ff0ff;box-shadow:0 0 14px rgba(49,215,255,.35)}
.opt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:rgba(255,201,51,.25)}
.opt.on{background:linear-gradient(135deg,#38e0ff,#1aa9ea);border-color:#c8f7ff;box-shadow:0 0 20px rgba(49,215,255,.6)}
.opt.on b{color:#001320}.opt.on span{color:#00263c}.opt.on::before{background:var(--yl)}
#pnA{left:calc(18px + env(safe-area-inset-left,0px));top:96px;width:min(312px,30vw);bottom:calc(var(--bh) + 36px + env(safe-area-inset-bottom,0px));padding:14px 14px 4px}
#pnA .opt{margin:0 0 10px}
#pnB{left:calc(18px + env(safe-area-inset-left,0px));right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));height:var(--bh);display:grid;grid-template-columns:1fr 1.3fr;padding:0}
#pnD,#pnM{padding:13px 16px 12px;min-width:0;position:relative;z-index:1}
#pnM{border-left:1px solid rgba(49,215,255,.35)}
#dif,#misC{display:flex;gap:10px}

#tGo{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--bh) + 46px + env(safe-area-inset-bottom,0px));text-align:center;pointer-events:none;z-index:2;animation:tkp 2.2s ease-in-out infinite}
#bPlay{pointer-events:auto;cursor:pointer;display:block;margin:0 auto;width:min(450px,42vw);height:clamp(66px,11vh,96px);border:0;background:linear-gradient(180deg,#5bffa6,#12c968);color:#00200e;font:900 clamp(26px,3.6vw,44px) "Eurostile","Bank Gothic","Orbitron","Segoe UI","Trebuchet MS",Arial,sans-serif;letter-spacing:.28em;padding-left:.28em;text-transform:uppercase;clip-path:polygon(24px 0,100% 0,calc(100% - 24px) 100%,0 100%);box-shadow:inset 0 0 26px rgba(255,255,255,.45);transition:transform .12s,filter .12s}
#bPlay:hover{transform:scale(1.035);filter:brightness(1.1)}
#bPlay kbd{font-size:11px;letter-spacing:.2em;vertical-align:middle;margin-left:14px;border-color:rgba(0,40,20,.55);background:rgba(255,255,255,.35);color:#00200e}
@keyframes tkp{0%,100%{filter:drop-shadow(0 0 12px rgba(70,255,150,.6))}50%{filter:drop-shadow(0 0 28px rgba(70,255,150,.95))}}
#bTut{pointer-events:auto;cursor:pointer;margin-top:12px;background:rgba(0,26,48,.7);border:1px solid rgba(49,215,255,.65);color:var(--cy);padding:7px 20px;font:700 12px inherit;letter-spacing:.28em;text-transform:uppercase}
#bTut:hover{background:rgba(49,215,255,.2)}
#bTut kbd{border-color:rgba(49,215,255,.5);background:rgba(49,215,255,.12);color:var(--cy)}
#tScore{right:calc(18px + env(safe-area-inset-right,0px));top:96px;width:min(250px,22vw);padding:12px 14px 8px}
#tScore .hr{grid-template-columns:20px 1fr;color:var(--cy);padding:3px 4px}
#tScore .hr i{color:var(--yl)}#tScore .hr span{color:#7fe9ff}#tScore .hr em{grid-column:2;color:var(--cyd);font-size:10px;text-transform:none}
#tScore .hr:nth-child(n+4){display:none}#tScore .hr.me{background:rgba(255,201,51,.15)}#tScore .hr.dim{color:var(--cyd);text-transform:none}
#fade{position:fixed;left:0;top:0;width:100%;height:100%;background:#000;opacity:0;pointer-events:none;z-index:9}
@media (max-width:900px){#tScore{display:none}#pnA{width:min(260px,34vw)}.opt span{font-size:11px}}
@media (max-height:640px){#title{--bh:168px}#dif .opt span,#misC .opt span{font-size:10px}}

#eng{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;padding:8px 12px 8px;background:linear-gradient(135deg,rgba(0,28,52,.8),rgba(0,10,22,.86));border:1px solid rgba(49,215,255,.75);box-shadow:0 0 18px rgba(49,215,255,.24),inset 0 0 22px rgba(49,215,255,.09);font-family:"Eurostile","Bank Gothic","Orbitron","Segoe UI","Trebuchet MS",Arial,sans-serif;z-index:5;user-select:none;-webkit-user-select:none;background-image:linear-gradient(#ffc933,#ffc933),linear-gradient(#ffc933,#ffc933),linear-gradient(135deg,rgba(0,28,52,.8),rgba(0,10,22,.86));background-repeat:no-repeat;background-position:left top,left top,0 0;background-size:14px 3px,3px 14px,100% 100%}
#eng .et{font-size:10px;letter-spacing:.38em;color:#ffc933;font-weight:800;margin:0 0 6px 2px}
#eng .row{display:flex;gap:12px}
#eng .sw{width:62px;text-align:center;cursor:pointer}
#eng .lamp{display:block;width:10px;height:10px;border-radius:50%;margin:0 auto 3px;background:#3a1010;box-shadow:inset 0 0 3px rgba(0,0,0,.8)}
#eng .st{display:block;font-style:normal;font-size:9px;letter-spacing:.2em;color:#ff7468;height:11px;font-weight:800}
#eng .tg{display:block;position:relative;width:32px;height:50px;margin:3px auto 0;background:linear-gradient(90deg,#06121c,#10324a 50%,#06121c);border:1px solid #31d7ff;border-radius:7px;box-shadow:inset 0 0 8px rgba(0,0,0,.8)}
#eng .tg::after{content:"";position:absolute;left:50%;bottom:4px;width:12px;height:28px;margin-left:-6px;border-radius:6px;background:linear-gradient(90deg,#8ea4b4,#f1f9ff 45%,#7a90a2);box-shadow:0 2px 4px rgba(0,0,0,.7);transition:bottom .12s,top .12s}
#eng .tg::before{content:"";position:absolute;left:50%;top:4px;width:12px;height:3px;margin-left:-6px;background:rgba(49,215,255,.4)}
#eng .sw.on .tg::after{bottom:auto;top:4px}
#eng .sw.on .tg{border-color:#7dffb0}
#eng .sw b{display:block;margin-top:5px;font-size:12px;letter-spacing:.14em;color:#31d7ff;font-weight:800}
#eng .sw em{display:block;font-style:normal;font-size:9px;letter-spacing:.22em;color:#ffc933}
#eng .sw.on .lamp{background:#3dff8d;box-shadow:0 0 9px #3dff8d}
#eng .sw.on .st{color:#7dffb0}
#eng .sw.sp .lamp{background:#ffc933;box-shadow:0 0 9px #ffc933}
#eng .sw.sp .st{color:#ffc933}
#eng .sw:hover .tg{border-color:#fff}
</style></head><body>
<canvas id="gl"></canvas><canvas id="hud"></canvas>
<div id="ui">
 <div id="title">
  <div id="tHead"><h1>F-15 EAGLE</h1><div class="sub">MOUNTAIN AIRBASE &middot; FLIGHT SIMULATOR</div></div>
  <div id="tScore" class="holo"><div class="ph">TOP FLIGHTS</div><div id="hsT"></div></div>
  <div id="pnA" class="holo"><div class="ph">AIRCRAFT</div><div id="acC"></div></div>
  <div id="tGo"><button id="bPlay" tabindex="-1">TAKEOFF</button><button id="bTut" tabindex="-1">TUTORIAL <kbd>T</kbd></button></div>
  <div id="pnB" class="holo"><div id="pnD"><div class="ph">DIFFICULTY</div><div id="dif"></div></div><div id="pnM"><div class="ph">MODE</div><div id="misC"></div></div></div>
 </div>
 <div id="sb" class="card"></div><div id="mis" class="card"></div><div id="tut" class="card"></div><div id="end"></div>
</div>
<div id="eng"><div class="et">ENGINES</div><div class="row">
  <div class="sw on" data-e="0"><i class="lamp"></i><i class="st">ON</i><span class="tg"></span><b>ENG 1</b><em>LEFT</em></div>
  <div class="sw on" data-e="1"><i class="lamp"></i><i class="st">ON</i><span class="tg"></span><b>ENG 2</b><em>CENTER</em></div>
  <div class="sw on" data-e="2"><i class="lamp"></i><i class="st">ON</i><span class="tg"></span><b>ENG 3</b><em>RIGHT</em></div></div></div>
<div id="fade"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const V=(x,y,z)=>new THREE.Vector3(x,y,z),D2R=Math.PI/180,KT=1.944,FT=3.281,G=9.81;
let M=20000,S=56;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),R=Math.random;
const gl=document.getElementById('gl'),hc=document.getElementById('hud'),H=hc.getContext('2d');
const ren=new THREE.WebGLRenderer({canvas:gl,antialias:(devicePixelRatio||1)<1.5,alpha:false,stencil:false,powerPreference:'high-performance'}),scene=new THREE.Scene(),AN=Math.min(4,ren.capabilities.getMaxAnisotropy());ren.setClearColor(0xbcd4ea);
scene.fog=new THREE.Fog(0xbcd4ea,6000,38000);
const cam=new THREE.PerspectiveCamera(60,1,2,100000);
let SW=1,SH=1,DPR=1,rsMax=Math.min(devicePixelRatio||1,2),rs=rsMax,rsLim=rsMax;
function applyRes(){ren.setPixelRatio(rs);ren.setSize(SW,SH,false)}
function size(){SW=innerWidth;SH=innerHeight;DPR=Math.min(devicePixelRatio||1,2);applyRes();hc.width=SW*DPR;hc.height=SH*DPR;cam.aspect=SW/SH;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();
const hemi=new THREE.HemisphereLight(0xdfeeff,0x4a5a3a,.9);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2d8,.9);sun.position.set(.5,1,.3);scene.add(sun);

// sky
const sg=new THREE.SphereGeometry(60000,24,12),pa=sg.attributes.position,cl=new Float32Array(pa.count*3);
for(let i=0;i<pa.count;i++){const t=clamp(pa.getY(i)/60000,0,1),c=new THREE.Color(0xbcd4ea).lerp(new THREE.Color(0x2d6cb5),Math.pow(t,.5));cl.set([c.r,c.g,c.b],i*3)}
sg.setAttribute('color',new THREE.BufferAttribute(cl,3));
const sky=new THREE.Mesh(sg,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false}));scene.add(sky);

function tex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=AN;return t}
// ground
const TILE=500,GL=120000;
const gt=tex(256,256,(x,w,h)=>{x.fillStyle='#4f7a3c';x.fillRect(0,0,w,h);for(let i=0;i<2500;i++){x.fillStyle=`rgba(${30+R()*60|0},${80+R()*60|0},${30+R()*40|0},.35)`;x.fillRect(R()*w,R()*h,2+R()*6,2+R()*6)}x.strokeStyle='rgba(20,40,15,.3)';x.strokeRect(0,0,w,h)});
gt.wrapS=gt.wrapT=THREE.RepeatWrapping;gt.repeat.set(GL/TILE,GL/TILE);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(GL,GL),new THREE.MeshLambertMaterial({map:gt,polygonOffset:true,polygonOffsetFactor:3,polygonOffsetUnits:3}));ground.rotation.x=-Math.PI/2;ground.position.y=-.2;scene.add(ground);

// runways (th: heading rotation; forward = (-sin th, 0, -cos th))
const RW=[{id:'A',x:0,z:-1700,th:0,len:3400,wid:60},{id:'B',x:-6000,z:-10000,th:-Math.PI/2,len:3000,wid:60}];
const rt=tex(64,2048,(x,w,h)=>{x.fillStyle='#3a3d42';x.fillRect(0,0,w,h);x.fillStyle='#e8e8e8';x.fillRect(2,0,1,h);x.fillRect(w-3,0,1,h);
 for(let y=130;y<h-130;y+=44)x.fillRect(w/2-1,y,2,22);
 for(let i=0;i<8;i++){x.fillRect(6+i*7,20,4,36);x.fillRect(6+i*7,h-56,4,36)}
 for(const y of[220,300]){x.fillRect(14,y,7,28);x.fillRect(w-21,y,7,28);x.fillRect(14,h-y-28,7,28);x.fillRect(w-21,h-y-28,7,28)}});
for(const r of RW){const g=new THREE.Group();g.position.set(r.x,.02,r.z);g.rotation.y=r.th;
 const m=new THREE.Mesh(new THREE.PlaneGeometry(r.wid,r.len),new THREE.MeshLambertMaterial({map:rt,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}));m.rotation.x=-Math.PI/2;g.add(m);scene.add(g);
 const b=new THREE.Mesh(new THREE.CylinderGeometry(12,12,1800,12,1,true),new THREE.MeshBasicMaterial({color:0x66ffcc,transparent:true,opacity:.22,depthWrite:false,side:THREE.DoubleSide}));b.position.set(r.x,900,r.z);scene.add(b)}
function rwAt(p){for(const L of[RW,CV])for(const r of L){const dx=p.x-r.x,dz=p.z-r.z,c=Math.cos(r.th),s=Math.sin(r.th),al=-dx*s-dz*c,lat=dx*c-dz*s;if(Math.abs(al)<r.len/2&&Math.abs(lat)<r.wid/2)return{r,al,lat}}return null}

// mountains + clouds
function bake(list,mat){const gs=list.map(([g,m])=>{const c=new THREE.BufferGeometry().copy(g);c.applyMatrix4(m);return c});

 {t:'Gun turrets',h:`The red-marked ground targets are twin-cannon turrets. Within about 1.6 km they track you and fire bursts at where your jet will be, so don't fly straight at them. Within 600 m a turret also launches a homing missile once a minute: when MISSILE WARNING flashes, turn hard and climb. Cannon and missiles destroy them. They hold fire in this tutorial.`},
